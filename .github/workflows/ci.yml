name: ci

on:
  push:
  pull_request:

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Desktop accessibility stack for the Stage 4 tests
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus at-spi2-core python3-pyatspi gir1.2-atspi-2.0 gir1.2-gtk-3.0 xdotool
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: Chromium for the browser rung
        run: |
          npx playwright install --with-deps chromium
          echo "ONDO_CHROMIUM=$(node -e "console.log(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"
      # System Python, so the venv can see pyatspi and PyGObject from apt.
      - run: python3 -m venv --system-site-packages .venv && .venv/bin/pip install -e "agent[dev,desktop]"
      # Both wire formats run in every build. Agnosticism that is not tested is a story.
      - run: .venv/bin/pytest -q agent/tests
      - name: Gate thresholds still match their measurement
        run: |
          .venv/bin/python -m ondo_agent.decision.calibrate --fixtures agent/fixtures/decision --out /tmp/t.json
          python3 -c 'import json,sys; a=json.load(open("/tmp/t.json"))["thresholds"]; b=json.load(open("agent/config/thresholds.json"))["thresholds"]; sys.exit(0 if a==b else "re-run calibration and commit agent/config/thresholds.json")'

  web-and-control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build --workspace web
