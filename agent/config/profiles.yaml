# Capability profiles. The harness reads these and adapts; the loop never branches
# on a provider. Adding a provider is a new entry here.
#
# Model names are aliases resolved by the gateway (see deploy/litellm.yaml), so the
# agent config never names a vendor's model. Point ORCHESTRATOR_* at your own.

gateway:
  # Any OpenAI-compatible endpoint: a self-hosted LiteLLM (recommended), OpenRouter,
  # or a model you host yourself behind vLLM.
  adapter: openai_chat
  base_url: ${ONDO_GATEWAY_URL:-http://localhost:4000}
  api_key_env: ONDO_GATEWAY_KEY
  model: ${ONDO_ORCHESTRATOR_MODEL:-orchestrator}
  supports_vision: false
  supports_prefix_cache: automatic
  reasoning_control: none
  parallel_tool_calls: true
  context_window: 200000
  max_output_tokens: 8192

messages:
  # The second wire format, kept green from day one.
  adapter: messages
  base_url: ${ONDO_MESSAGES_URL:-https://api.example.invalid}
  api_key_env: ONDO_MESSAGES_KEY
  model: ${ONDO_MESSAGES_MODEL:-orchestrator}
  supports_vision: false
  supports_prefix_cache: explicit
  reasoning_control: budget
  parallel_tool_calls: true
  context_window: 200000
  max_output_tokens: 8192

demo:
  # Deterministic scripted policies for running the product with no provider.
  # Every event it produces is labelled with this profile name.
  adapter: scripted
  model: demo-scripted
  drive: demo/Northwind client drive
  portal_url: http://127.0.0.1:8765
