[project]
name = "ondo-agent"
version = "0.1.0"
description = "Ondo Quartermaster desktop agent: harness, model layer, decision layer, tools and permission broker."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "websockets>=13",
  "pyyaml>=6",
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "pypdf>=5",
  "mcp>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
ondo-agent = "ondo_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
