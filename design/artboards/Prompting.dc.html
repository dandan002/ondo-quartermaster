<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prompting Ondo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&amp;display=swap">
<style>
body { margin: 0; background: #ffffff; color: #252a31; font-family: "Source Sans 3", "Segoe UI", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
a { color: #2d72d2; text-decoration: none; }
a:hover { color: #215db0; }
button { font: inherit; }

@keyframes qm-rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes qm-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes qm-caret { 0%, 45% { opacity: 1; } 55%, 100% { opacity: 0; } }
@keyframes qm-edge { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
@keyframes qm-scan { 0% { transform: translateX(-30%); } 100% { transform: translateX(430%); } }

.qm-fade { opacity: 0; animation: qm-fade 0.25s ease-out forwards; }
.qm-rise { opacity: 0; animation: qm-rise 0.25s ease-out forwards; }
.qm-d1 { animation-delay: 0.06s; }
.qm-d2 { animation-delay: 0.12s; }
.qm-d3 { animation-delay: 0.18s; }
.qm-d4 { animation-delay: 0.24s; }
.qm-caret { animation: qm-caret 1.1s step-end infinite; }
.qm-edge { animation: qm-edge 2.8s ease-in-out infinite; }
.qm-scan { animation: qm-scan 1.8s cubic-bezier(.4,0,.2,1) infinite; }

@media (prefers-reduced-motion: reduce) {
  .qm-fade, .qm-rise, .qm-caret, .qm-edge, .qm-scan { animation: none; opacity: 1; transform: none; }
}
</style>
</helmet>

<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #ffffff">

  <div style="position: absolute; inset: 0; display: flex">
    <div style="width: 300px; flex-shrink: 0; background: #252a31; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="height: 24px; width: 150px; background: #2f343c; border-radius: 4px"></div>
      <div style="height: 36px; border: 1px solid #404854; border-radius: 999px"></div>
      <div style="height: 40px; background: #2f343c; border-radius: 4px"></div>
      <div style="height: 40px; background: #2f343c; border-radius: 4px"></div>
      <div style="height: 40px; background: #2f343c; border-radius: 4px"></div>
    </div>
    <div style="flex-grow: 1; padding: 32px; display: flex; flex-direction: column; gap: 16px">
      <div style="height: 40px; width: 380px; background: #edeff2; border-radius: 4px"></div>
      <div style="height: 20px; width: 520px; background: #f6f7f9; border-radius: 4px"></div>
      <div style="height: 120px; border: 1px solid #e5e8eb; border-radius: 4px"></div>
      <div style="height: 180px; border: 1px solid #e5e8eb; border-radius: 4px"></div>
    </div>
  </div>

  <div class="qm-fade" style="position: absolute; inset: 0; background: rgba(17,20,24,.4)"></div>

  <div class="qm-edge" style="position: absolute; inset: 0; border: 2px solid #2d72d2; pointer-events: none"></div>

  <div class="qm-fade" style="position: absolute; top: 0; left: 0; right: 0; height: 2px; overflow: hidden">
    <div class="qm-scan" style="width: 30%; height: 2px; background: #8abbff"></div>
  </div>

  <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; padding-top: 180px; gap: 16px">

    <div class="qm-rise" style="width: 720px; background: #ffffff; border-radius: 12px; box-shadow: 0 8px 24px rgba(17,20,24,.2); display: flex; flex-direction: column">

      <div style="padding: 20px 24px; display: flex; align-items: center; gap: 12px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2d72d2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0" aria-hidden="true"><path d="M20 15.5A2.5 2.5 0 0 1 17.5 18H9l-4 3v-3.5A2.5 2.5 0 0 1 4 15.5v-8A2.5 2.5 0 0 1 6.5 5h11A2.5 2.5 0 0 1 20 7.5z"></path></svg>
        <label for="prompt" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Ask Ondo, or say what to do</label>
        <span style="flex-grow: 1; display: flex; align-items: center; gap: 1px">
          <span style="font-size: 22px; line-height: 1.3; color: #1c2127">Reconcile the Fairhaven invoices against the</span>
          <span class="qm-caret" style="width: 2px; height: 24px; background: #2d72d2; display: inline-block; margin-left: 2px"></span>
        </span>
        <input id="prompt" type="text" value="" placeholder="" style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none">
        <span style="flex-shrink: 0; font-size: 13px; color: #5f6b7c">Enter to run</span>
      </div>

      <div style="height: 1px; background: #e5e8eb"></div>

      <div style="padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 2px">
        <span style="padding: 4px 8px; font-size: 12px; font-weight: 500; letter-spacing: 0.04em; color: #5f6b7c">CONTINUE WITH</span>

        <button type="button" class="qm-rise qm-d1" style="width: 100%; padding: 10px 8px; display: flex; align-items: center; gap: 12px; background: #f6f7f9; border: none; border-radius: 4px; text-align: left; cursor: pointer">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#215db0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="1.5"></rect><path d="M9 20h6"></path></svg>
          <span style="flex-grow: 1; font-size: 16px; color: #1c2127">…the workbook open on screen</span>
          <span style="font-size: 13px; color: #5f6b7c">Excel — Q3_Renewals.xlsx</span>
        </button>

        <button type="button" class="qm-rise qm-d2" style="width: 100%; padding: 10px 8px; display: flex; align-items: center; gap: 12px; background: transparent; border: none; border-radius: 4px; text-align: left; cursor: pointer">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#5f6b7c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0" aria-hidden="true"><path d="M3.5 7.5A1.5 1.5 0 0 1 5 6h4l2 2.5h8A1.5 1.5 0 0 1 20.5 10v8A1.5 1.5 0 0 1 19 19.5H5A1.5 1.5 0 0 1 3.5 18z"></path></svg>
          <span style="flex-grow: 1; font-size: 16px; color: #1c2127">…the billing export in the Northwind drive</span>
          <span style="font-size: 13px; color: #5f6b7c">248 files</span>
        </button>

        <button type="button" class="qm-rise qm-d3" style="width: 100%; padding: 10px 8px; display: flex; align-items: center; gap: 12px; background: transparent; border: none; border-radius: 4px; text-align: left; cursor: pointer">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#5f6b7c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0" aria-hidden="true"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h10"></path></svg>
          <span style="flex-grow: 1; font-size: 16px; color: #1c2127">…the saved month-end close workflow</span>
          <span style="font-size: 13px; color: #5f6b7c">Ran 31 Aug</span>
        </button>
      </div>
    </div>

    <div class="qm-rise qm-d4" style="width: 720px; display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: rgba(37,42,49,.72); border-radius: 999px">
      <span style="width: 7px; height: 7px; border-radius: 50%; background: #8abbff; flex-shrink: 0"></span>
      <span style="flex-grow: 1; font-size: 14px; color: #f6f7f9">Ondo can see Excel and the billing portal while this is open</span>
      <span style="font-size: 13px; color: #abb3bf">Esc to dismiss · Esc twice to stop watching</span>
    </div>

  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
